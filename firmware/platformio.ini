; ScooterLab Firmware — Revisione 2026 (ADR-0002 / ADR-0003)
; Target primario: ESP32-S3 (TWAI/CAN nativo, USB-CDC, SPI Smart IMU + microSD)
; Target alternativo: ESP32-C5 (Wi-Fi 6 dual-band + TWAI)

[platformio]
default_envs = esp32-s3-level0

[env:esp32-s3-level0]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -D BUILD_LEVEL=0
    -D IMU_SAMPLE_HZ=100
    -D GPS_SAMPLE_HZ=5
    -D PIN_SPI_SCK=12
    -D PIN_SPI_MOSI=11
    -D PIN_SPI_MISO=13
    -D PIN_CS_IMU=10
    -D PIN_INT_IMU=9
    -D PIN_SD_SCK=36
    -D PIN_SD_MOSI=35
    -D PIN_SD_MISO=37
    -D PIN_CS_SD=14
    -D PIN_GPS_RX=18
    -D PIN_GPS_TX=17
    -D PIN_IGN_SENSE=4
    -D PIN_CAN_TX=5
    -D PIN_CAN_RX=6
    -D PIN_STATUS_LED=2

[env:esp32-s3-level1]
extends = env:esp32-s3-level0
build_flags =
    ${env:esp32-s3-level0.build_flags}
    -U BUILD_LEVEL
    -D BUILD_LEVEL=1
