name: ScooterLab CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  python-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e "./tools[dev,uns]"

      - name: Run Python test suite
        run: pytest tools/tests/ -v

      - name: Security & ADR hygiene check
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden = [f for f in tracked if f.endswith((".env", ".db", ".sqlite", ".slab", ".gpx"))]
          if forbidden:
              print("ERROR: forbidden tracked files:", forbidden)
              sys.exit(1)
          for req in ("AGENTS.md", "docs/adr/README.md"):
              if req not in tracked:
                  print("ERROR: missing required governance file:", req)
                  sys.exit(1)
          print("Security & ADR hygiene check PASSED")
          EOF

  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile & run C++17 firmware host tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include \
            firmware/src/config_nvs.cpp \
            firmware/src/slab_writer.cpp \
            firmware/src/power_monitor.cpp \
            firmware/src/uploader.cpp \
            firmware/src/imu_ism330is.cpp \
            firmware/src/gnss_ublox.cpp \
            firmware/src/session_manager.cpp \
            firmware/tests/test_firmware_host.cpp \
            -o /tmp/test_fw
          /tmp/test_fw
