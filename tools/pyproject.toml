[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scooterlab-tools"
version = "0.1.0"
description = "ScooterLab telemetry parser (.slab v1), synthetic session generator, secure ingest server and SYM maintenance tracker"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
uns = ["paho-mqtt>=2.0"]
scientific = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
